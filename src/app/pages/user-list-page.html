<div class="ul-page">
  <app-page-header [title]="'用户管理'" [descriptionText]="tenantLabel() + ' 的所有用户'">
    <button mat-button phActions (click)="openInvite()" data-fn="M00.F02.I06">
      邀请成员
    </button>
    <button
      mat-flat-button
      color="primary"
      phActions
      (click)="openCreate()"
      data-fn="M01.F04.I03"
    >
      创建成员
    </button>
  </app-page-header>

  <section class="ul-card">
    <div class="ul-card-head">
      <h2 class="ul-card-title" data-testid="user-total">
        用户列表 (共 {{ total() }} 人)
      </h2>
      <div class="ul-toolbar">
        <select
          aria-label="状态过滤"
          data-testid="status-filter"
          [value]="statusFilter()"
          (change)="onStatusFilter($event)"
        >
          <option value="">全部状态</option>
          @for (o of statusOptions; track o.value) {
          <option [value]="o.value">{{ o.label }}</option>
          }
        </select>
        <select
          aria-label="每页"
          data-testid="page-size"
          [value]="pageSize()"
          (change)="onPageSize($event)"
        >
          @for (n of pageSizes; track n) {
          <option [value]="n">{{ n }} 条/页</option>
          }
        </select>
      </div>
    </div>
    @if (list.isPending()) {
    <app-page-loading />
    } @else {
    <div class="ul-table-wrap">
      <table mat-table [dataSource]="users()">
        <ng-container matColumnDef="username">
          <th mat-header-cell *matHeaderCellDef>用户名</th>
          <td mat-cell *matCellDef="let u" class="ul-name">{{ u.username }}</td>
        </ng-container>
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>邮箱</th>
          <td mat-cell *matCellDef="let u" class="ul-email">{{ u.email }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>状态</th>
          <td mat-cell *matCellDef="let u"><app-status-badge [status]="u.status" /></td>
        </ng-container>
        <ng-container matColumnDef="roleCount">
          <th mat-header-cell *matHeaderCellDef>角色</th>
          <td mat-cell *matCellDef="let u">
            <span class="ul-rolecount">{{ u.roleIds.length }} 项</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="ul-col-actions">操作</th>
          <td mat-cell *matCellDef="let u" class="ul-actions">
            <button mat-button data-fn="M00.F02.I03" (click)="openDetail(u)">详情</button>
            <button mat-button data-fn="M01.F02.I01" (click)="openRoles(u)">
              分配角色
            </button>
            <button mat-button data-fn="M00.F02.I04" (click)="openEdit(u)">编辑</button>
            <button mat-button data-fn="M00.F02.I08" (click)="openStatusToggle(u)">
              {{ u.status === "active" ? "停用" : "启用" }}
            </button>
            <button
              mat-button
              class="ul-del"
              data-fn="M00.F02.I05"
              (click)="openDelete(u)"
            >
              删除
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          data-testid="user-row"
        ></tr>
      </table>
    </div>
    }
    <div class="ul-pager">
      <span data-testid="user-page-indicator">第 {{ page() + 1 }} 页</span>
      <div class="ul-pager-btns">
        <button mat-stroked-button [disabled]="!hasPrev()" (click)="prevPage()">
          上一页
        </button>
        <button mat-stroked-button [disabled]="!hasNext()" (click)="nextPage()">
          下一页
        </button>
      </div>
    </div>
  </section>
</div>
