<div class="tl-page">
  <app-page-header [title]="'租户管理'" [descriptionText]="descriptionText()">
    <button
      mat-flat-button
      color="primary"
      phActions
      (click)="openCreate()"
      data-fn="M00.F01.I02"
    >
      新建租户
    </button>
  </app-page-header>

  <section class="tl-card">
    <h2 class="tl-card-title">租户列表 ({{ tenants().length }})</h2>
    @if (list.isPending()) {
    <app-page-loading />
    } @else if (tenants().length === 0) {
    <app-empty-state title="还没有租户" descriptionText="创建第一个租户开始使用" />
    } @else {
    <div class="tl-table-wrap">
      <table mat-table [dataSource]="tenants()">
        <ng-container matColumnDef="check">
          <th mat-header-cell *matHeaderCellDef class="tl-col-check"></th>
          <td mat-cell *matCellDef="let t">
            @if (t.id === selectedId()) {
            <mat-icon class="tl-check" data-testid="tenant-selected-mark">check</mat-icon>
            }
          </td>
        </ng-container>
        <ng-container matColumnDef="tenantKey">
          <th mat-header-cell *matHeaderCellDef>Code</th>
          <td mat-cell *matCellDef="let t" class="tl-key">{{ t.tenantKey }}</td>
        </ng-container>
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>名称</th>
          <td mat-cell *matCellDef="let t" class="tl-name">{{ t.name }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>状态</th>
          <td mat-cell *matCellDef="let t">
            <app-status-badge [status]="t.status" />
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="tl-col-actions">操作</th>
          <td mat-cell *matCellDef="let t" class="tl-actions">
            <button
              mat-button
              data-fn="M00.F01.I04"
              (click)="$event.stopPropagation(); openEdit(t)"
            >
              编辑
            </button>
            <button
              mat-button
              class="tl-del"
              data-fn="M00.F01.I05"
              (click)="$event.stopPropagation(); openDelete(t)"
            >
              删除
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          class="tl-row"
          [class.selected]="row.id === selectedId()"
          data-testid="tenant-row"
          [attr.data-selected]="row.id === selectedId() ? 'true' : 'false'"
          (click)="selectTenant(row)"
        ></tr>
      </table>
    </div>
    }
  </section>
</div>
