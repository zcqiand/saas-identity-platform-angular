<div class="ta-page">
  <app-page-header [title]="'租户应用'" [descriptionText]="tenantLabel() + ' 订阅的应用'">
    <button
      mat-flat-button
      color="primary"
      phActions
      (click)="openSubscribe()"
      data-fn="M00.F05.I02"
    >
      订阅应用
    </button>
  </app-page-header>

  <section class="ta-card">
    <h2 class="ta-card-title">订阅列表 ({{ apps().length }})</h2>
    @if (list.isPending()) {
    <app-page-loading />
    } @else if (apps().length === 0) {
    <app-empty-state
      title="还没有订阅应用"
      descriptionText="点击「订阅应用」为该租户接入第一个应用。"
    />
    } @else {
    <div class="ta-table-wrap">
      <table mat-table [dataSource]="apps()">
        <ng-container matColumnDef="appName">
          <th mat-header-cell *matHeaderCellDef>应用</th>
          <td mat-cell *matCellDef="let a" class="ta-name">{{ appName(a.clientId) }}</td>
        </ng-container>
        <ng-container matColumnDef="clientId">
          <th mat-header-cell *matHeaderCellDef>Client ID</th>
          <td mat-cell *matCellDef="let a" class="ta-client">{{ a.clientId }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>状态</th>
          <td mat-cell *matCellDef="let a">
            <span
              class="ta-status"
              [class.ta-status--1]="a.status === 1"
              [class.ta-status--0]="a.status === 0"
              [class.ta-status--other]="a.status !== 0 && a.status !== 1"
              >{{ statusLabel(a.status) }}</span
            >
          </td>
        </ng-container>
        <ng-container matColumnDef="expireTime">
          <th mat-header-cell *matHeaderCellDef>到期时间</th>
          <td mat-cell *matCellDef="let a" class="ta-expire">
            {{ expireText(a.expireTime) }}
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="ta-col-actions">操作</th>
          <td mat-cell *matCellDef="let a" class="ta-actions">
            <button mat-button data-fn="M00.F05.I03" (click)="openEdit(a)">编辑</button>
            <button
              mat-button
              class="ta-del"
              data-fn="M00.F05.I04"
              (click)="openRemove(a)"
            >
              取消订阅
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          data-testid="tenant-app-row"
        ></tr>
      </table>
    </div>
    }
  </section>
</div>
