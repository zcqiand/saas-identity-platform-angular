<div class="mt-page">
  <app-page-header
    [title]="'菜单管理'"
    [descriptionText]="
      '当前应用 ' +
      (currentApp() ? currentApp()!.clientName : '—') +
      ' (' +
      (currentApp() ? currentApp()!.clientId : '') +
      ')'
    "
  >
    <select
      aria-label="选择应用"
      class="mt-selector"
      data-testid="app-selector-trigger"
      [value]="currentApp()?.clientId ?? ''"
      (change)="onAppChange($event)"
      phActions
    >
      @for (a of allApps(); track a.id) {
      <option [value]="a.clientId" [attr.data-testid]="'app-option-' + a.id">
        {{ a.clientName }}
      </option>
      }
    </select>
    <button
      mat-flat-button
      color="primary"
      phActions
      (click)="openCreate()"
      data-fn="M04.F04.I02"
    >
      新建菜单
    </button>
  </app-page-header>

  <section class="mt-card">
    <h2 class="mt-card-title">菜单树 ({{ rows().length }} 项)</h2>
    @if (menusQ.isPending()) {
    <app-page-loading />
    } @else if (rows().length === 0) {
    <app-empty-state title="暂无菜单" descriptionText="点击右上「新建菜单」开始" />
    } @else {
    <div class="mt-table-wrap">
      <table mat-table [dataSource]="rows()">
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>名称</th>
          <td mat-cell *matCellDef="let r" class="mt-name">
            <span class="mt-indent" [style.paddingLeft.px]="r.depth * 16">
              @if (r.hasChildren) {
              <button
                type="button"
                class="mt-toggle"
                [attr.aria-label]="isExpanded(r.id) ? '折叠子菜单' : '展开子菜单'"
                [attr.data-testid]="'menu-toggle-' + r.id"
                (click)="toggleExpand(r.id)"
              >
                {{ isExpanded(r.id) ? "▾" : "▸" }}
              </button>
              } @else {
              <span class="mt-spacer"></span>
              }
              <span>{{ r.title }}</span>
            </span>
          </td>
        </ng-container>
        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef>类型</th>
          <td mat-cell *matCellDef="let r">
            <span class="mt-chip">{{ typeLabel(r.type) }}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>状态</th>
          <td mat-cell *matCellDef="let r">
            <span class="mt-chip">{{ statusLabel(r.status) }}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="mt-col-actions">操作</th>
          <td mat-cell *matCellDef="let r" class="mt-actions">
            <button mat-button data-fn="M04.F04.I07" (click)="openMove(r)">移动</button>
            <button mat-button data-fn="M04.F04.I04" (click)="openEdit(r)">编辑</button>
            <button
              mat-button
              class="mt-del"
              data-fn="M04.F04.I05"
              (click)="openDelete(r)"
            >
              删除
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          data-testid="menu-row"
          [attr.data-depth]="row.depth"
          [attr.data-menu-id]="row.id"
        ></tr>
      </table>
    </div>
    }
  </section>
</div>
